name: Post daily links

on:
  schedule:
    # Mon-Fri from 12:00 PM Eastern. GitHub often runs schedules hours late or
    # drops them, so check every 30 min (off the busy :00 mark) through the
    # afternoon; the first run at/after noon posts, the rest see "already posted".
    - cron: "7,37 16-23 * * 1-5"
  workflow_dispatch:        # "Run workflow" button = force a post now
    inputs:
      force:
        description: "Post even if already posted today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: post-links

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Scheduled runs only act from noon New York time on (before noon in
          # winter, when 16:xx UTC is 11:xx EST, they skip).
          hour=$(TZ=America/New_York date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" -lt 12 ]; then
            echo "It's ${hour}:xx in New York, before noon - skipping"; exit 0
          fi
          python post_once.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1463655636817416213"
          FORCE: ${{ inputs.force }}
      - name: Remember what was posted
        run: |
          git config user.name "links-bot"
          git config user.email "links-bot@users.noreply.github.com"
          git add last_posted.json
          git diff --cached --quiet || (git commit -m "Posted links" && git push)
